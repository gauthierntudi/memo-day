services:
  postgres:
    image: postgres:16
    container_name: dailysitereport_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dailysitereport}
      POSTGRES_USER: ${POSTGRES_USER:-parkland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Portainer stack env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkland -d dailysitereport"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: dailysitereport_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-parkland}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dailysitereport}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in Portainer stack env}
      NODE_ENV: production
      PORT: "5000"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-3000}:5000"

volumes:
  postgres_data:
